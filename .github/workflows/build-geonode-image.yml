name: Build GeoNode image

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 4.4.x-geohosting

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  # One build per PR for open/update events; a newer push cancels the older build.
  # The merge build runs in its own group so it is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.merged && 'merged' || 'pr' }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kartoza_geonode
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  build:
    # Skip PRs that were closed without being merged.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch, commit and image tag
        id: meta
        env:
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$MERGED" = "true" ]; then
            branch="$BASE_REF"
            sha="$MERGE_SHA"
          else
            branch="$HEAD_REF"
            sha="$HEAD_SHA"
          fi
          short_sha="${sha:0:7}"
          # Docker tags allow only [A-Za-z0-9_.-], must not start with '.' or '-', max 128 chars.
          safe_branch="$(echo "$branch" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]*//' | cut -c1-110)"
          tag="${safe_branch}-${short_sha}"
          {
            echo "branch=$branch"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "image=${IMAGE_NAME}:${tag}"
            echo "artifact=${IMAGE_NAME}-${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}:${tag}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Free disk space
        # The GeoNode image is several GB; the default runner does not have room for
        # the build cache plus the exported tarball without this.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: prod
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.meta.outputs.branch }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ steps.meta.outputs.artifact }}.tar

      - name: Upload image artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: ${{ runner.temp }}/${{ steps.meta.outputs.artifact }}.tar
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

      - name: Comment on PR
        if: always() && steps.meta.outcome == 'success'
        uses: actions/github-script@v7
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          ARTIFACT_NAME: ${{ steps.meta.outputs.artifact }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SHA: ${{ steps.meta.outputs.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          script: |
            const {
              IMAGE, ARTIFACT_NAME, ARTIFACT_URL, BRANCH, SHA, MERGED,
              BUILD_OUTCOME, UPLOAD_OUTCOME, ARTIFACT_RETENTION_DAYS,
            } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = BUILD_OUTCOME === 'success' && UPLOAD_OUTCOME === 'success';
            const trigger = MERGED === 'true' ? 'merge' : 'pull request update';

            let body;
            if (ok) {
              body = [
                `### :white_check_mark: GeoNode image built (${trigger})`,
                '',
                '| | |',
                '|---|---|',
                `| Image | \`${IMAGE}\` |`,
                `| Branch | \`${BRANCH}\` |`,
                `| Commit | ${SHA} |`,
                `| Artifact | [${ARTIFACT_NAME}](${ARTIFACT_URL}) (kept ${ARTIFACT_RETENTION_DAYS} days) |`,
                `| Workflow run | ${runUrl} |`,
                '',
                'Load it locally:',
                '```bash',
                `unzip ${ARTIFACT_NAME}.zip`,
                `docker load -i ${ARTIFACT_NAME}.tar`,
                '```',
              ].join('\n');
            } else {
              body = [
                `### :x: GeoNode image build failed (${trigger})`,
                '',
                `Image \`${IMAGE}\` for commit ${SHA} was not produced.`,
                `Build: \`${BUILD_OUTCOME}\`, upload: \`${UPLOAD_OUTCOME}\`.`,
                '',
                `See the workflow run: ${runUrl}`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
