version: '3.9'

# Common Django template for GeoNode and Celery services below
x-common-django:
  &default-common-django
  image: meomancer/geonode:${GEONODE_BASE_IMAGE_VERSION}
  build:
    context: ../
    dockerfile: deployment/docker/Dockerfile
    target: prod
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - '../src:/usr/src/kartoza_geonode'
    - statics:/mnt/volumes/statics
    - geoserver-data-dir:/geoserver_data/data
    - backup-restore:/backup_restore
    - data:/data
    - tmp:/tmp
  depends_on:
    db-geonode:
      condition: service_healthy
    db-geodata:
      condition: service_healthy

# Common Django template for GeoNode and Celery services below
x-common-db:
  # PostGIS database.
  &default-common-db
  image: ${COMPOSE_PROJECT_NAME}/postgis:${POSTGRES_BASE_IMAGE_VERSION}
  build:
    context: ../deployment/postgresql/
    args:
      - BASE_IMAGE_VERSION=${POSTGRES_BASE_IMAGE_VERSION}
  command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
  env_file:
    - .env
  restart: unless-stopped
  healthcheck:
    test: "pg_isready -d postgres -U postgres"

services:

  # Our custom django application. It includes Geonode.
  django:
    <<: *default-common-django
    container_name: ${COMPOSE_PROJECT_NAME}-django
    healthcheck:
      test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://django:8001/"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    environment:
      - IS_CELERY=False
    entrypoint: [ "/usr/src/kartoza_geonode/entrypoint.sh" ]
    command: "uwsgi --ini /usr/src/kartoza_geonode/uwsgi.ini"

  # Celery worker that executes celery tasks created by Django.
  celery:
    <<: *default-common-django
    container_name: ${COMPOSE_PROJECT_NAME}-celery
    depends_on:
      django:
        condition: service_healthy
    environment:
      - IS_CELERY=True
    entrypoint: [ "/usr/src/kartoza_geonode/entrypoint.sh" ]
    command: "celery-cmd"

  # Nginx is serving django static and media files and proxies to django and geonode
  geonode:
    image: ${COMPOSE_PROJECT_NAME}/nginx:${NGINX_BASE_IMAGE_VERSION}
    build:
      context: ../deployment/nginx/
      args:
        - BASE_IMAGE_VERSION=${NGINX_BASE_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    env_file:
      - .env
    environment:
      - RESOLVER=127.0.0.11
      - GEONODE_LB_PORT=8000
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - nginx-confd:/etc/nginx
      - nginx-certificates:/geonode-certificates
      - statics:/mnt/volumes/statics
    restart: unless-stopped

  # memcached service
  memcached:
    image: memcached:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-memcached
    command: memcached ${MEMCACHED_OPTIONS}
    restart: on-failure
    healthcheck:
      test: nc -z 127.0.0.1 11211
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Gets and installs letsencrypt certificates
  letsencrypt:
    image: ${COMPOSE_PROJECT_NAME}/letsencrypt:${LETSENCRYPT_BASE_IMAGE_VERSION}
    build:
      context: ../deployment/letsencrypt
      args:
        - BASE_IMAGE_VERSION=${LETSENCRYPT_BASE_IMAGE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-letsencrypt
    env_file:
      - .env
    volumes:
      - nginx-certificates:/geonode-certificates
    restart: unless-stopped

  # Geoserver backend
  geoserver:
    image: meomancer/geoserver:2.24.4-geo-v2024.08.15
    build:
      context: ../deployment/geoserver-2.24.4
    container_name: ${COMPOSE_PROJECT_NAME}-geoserver
    healthcheck:
      test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://geoserver:8080/geoserver/ows"
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - backup-restore:/backup_restore
      - data:/data
      - tmp:/tmp
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy

  db-geonode:
    <<: *default-common-db
    container_name: ${COMPOSE_PROJECT_NAME}-db-geonode
    volumes:
      - db-geonode-data:/var/lib/postgresql/data
      - db-geonode-backups:/pg_backups
    env_file:
      - .env

  db-geodata:
    <<: *default-common-db
    container_name: ${COMPOSE_PROJECT_NAME}-db-geodata
    volumes:
      - db-geodata-data:/var/lib/postgresql/data
      - db-geodata-backups:/pg_backups
    env_file:
      - .env

  # Vanilla RabbitMQ service. This is needed by celery
  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  nginx-confd:
    name: ${COMPOSE_PROJECT_NAME}-nginxconfd
  nginx-certificates:
    name: ${COMPOSE_PROJECT_NAME}-nginxcerts
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  backup-restore:
    name: ${COMPOSE_PROJECT_NAME}-backup-restore
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
  rabbitmq:
    name: ${COMPOSE_PROJECT_NAME}-rabbitmq

  db-geonode-data:
    name: ${COMPOSE_PROJECT_NAME}-db-geonode-data
  db-geonode-backups:
    name: ${COMPOSE_PROJECT_NAME}-db-geonode-backups

  db-geodata-data:
    name: ${COMPOSE_PROJECT_NAME}-db-geodata-data
  db-geodata-backups:
    name: ${COMPOSE_PROJECT_NAME}-db-geodata-backups
